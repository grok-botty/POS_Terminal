{% extends "base.html" %}

{% block title %}{{ title }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="stack narrow">
  <h1>{{ title }}</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    {% for field in form %}
      <label>
        <span>{{ field.label }}</span>
        {{ field }}
        {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
        {% if field.errors %}<small class="error">{{ field.errors|join:", " }}</small>{% endif %}
      </label>
    {% endfor %}
    <div class="row-actions">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a class="btn btn-ghost" href="{% url 'catalog:dashboard' %}">Отмена</a>
    </div>
  </form>
</section>
{% endblock %}
