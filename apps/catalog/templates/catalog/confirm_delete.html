{% extends "base.html" %}

{% block title %}Удаление · {{ app_name }}{% endblock %}

{% block content %}
<section class="stack narrow">
  <header class="page-header">
    <h1>Удалить {{ kind }}?</h1>
    <a class="btn btn-ghost" href="{% url 'catalog:dashboard' %}">← Отмена</a>
  </header>
  <div class="form-card">
    <p style="margin: 0 0 12px;">«{{ object }}» — удаление необратимо.</p>
    <form method="post" class="row-actions">
      {% csrf_token %}
      <button class="btn btn-primary" type="submit"
              style="background: var(--danger);">Да, удалить</button>
      <a class="btn btn-ghost" href="{% url 'catalog:dashboard' %}">Отмена</a>
    </form>
  </div>
</section>
{% endblock %}
