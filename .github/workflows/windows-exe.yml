# Build CashMachine.exe on a GitHub-hosted Windows runner and publish it.
#
# Push to main, and workflow_dispatch on main, after a green build:
#   - cut the next annotated tag vMAJOR.MINOR (v1.1 when none exist yet)
#   - publish a GitHub Release for that tag and keep every older v* release
#   - retarget only the floating tag/release named latest, so
#     /releases/download/latest/CashMachine.exe stays a stable URL
#
# A push of an existing vMAJOR.MINOR tag rebuilds that release and does not
# allocate another version. Creating the tag with GITHUB_TOKEN does not start
# a second workflow run; a tag pushed by a person does.
name: Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-publish-script:
    name: Test publish script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test version selection and release notes
        run: bash .github/scripts/publish-windows-release.test.sh

  build:
    name: Build exe
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    concurrency:
      # A newer push to the same ref replaces an in-progress build.
      # Publish is a separate job, so this cancel cannot cut off a tag push.
      group: cashmachine-windows-exe-${{ github.ref }}
      cancel-in-progress: true
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CASHMACHINE_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Collect static files
        env:
          CASHMACHINE_DB_PATH: ${{ runner.temp }}\collectstatic.sqlite3
        run: python manage.py collectstatic --noinput

      - name: Build exe
        run: pyinstaller --clean --noconfirm desktop\pyinstaller_spec.spec

      - name: PyInstaller warnings
        if: failure()
        run: |
          Get-ChildItem -Path build -Recurse -Filter "warn-*.txt" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "===== $($_.FullName) ====="; Get-Content $_.FullName }

      - name: Smoke test /pos/shift/
        env:
          CASHMACHINE_DB_PATH: ${{ runner.temp }}\cashmachine-smoke\cashmachine.sqlite3
          CASHMACHINE_SECRET_KEY: ci-smoke-not-a-production-key
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File desktop\smoke_test.ps1 -TimeoutSec 180

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashMachine-windows
          path: dist/CashMachine.exe
          if-no-files-found: error
          retention-days: 14

      - name: Summarize artifact
        if: success()
        shell: pwsh
        run: |
          $lines = @(
            "### CashMachine.exe",
            "- Workflow artifact: ``CashMachine-windows`` on this run",
            "- On main and on ``vMAJOR.MINOR`` tags, the publish job attaches this exe to a versioned release and refreshes https://github.com/$env:GITHUB_REPOSITORY/releases/download/latest/CashMachine.exe"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")

  publish:
    name: Publish release
    needs: [build, test-publish-script]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      # One publisher at a time for main and for version tags, so two runs
      # cannot claim the same next vX.Y or retarget `latest` together.
      # Do not cancel: a killed job can leave a tag with no exe attached.
      group: cashmachine-windows-exe-publish
      cancel-in-progress: false
    steps:
      - name: Checkout built commit
        uses: actions/checkout@v4
        with:
          # The exe artifact belongs to this run's SHA. main may move while
          # the Windows build is still going; do not check out the branch tip.
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: CashMachine-windows
          path: dist

      - name: Publish versioned release and floating latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXE_PATH: dist/CashMachine.exe
        run: bash .github/scripts/publish-windows-release.sh
